<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dalil QA — контроль деталей по эталону без обучения на дефектах и без светового бокса.">
  <meta name="theme-color" content="#15181b">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dalil QA">
  <meta name="format-detection" content="telephone=no">
  <title>Dalil QA</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Назад" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <a id="brand" class="brand" href="#/" aria-label="Dalil QA">
        <img src="icon.svg" width="30" height="30" alt="">
        <span class="brand-name">Dalil</span><span class="brand-tag">QA</span>
      </a>
      <h1 id="screenTitle" class="topbar-title"></h1>
      <div class="lang-toggle" role="group" aria-label="Language / Язык">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="hazard" aria-hidden="true"></div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <div class="boot">
      <div class="spinner"></div>
      <p data-i18n="loading">Загрузка…</p>
    </div>
  </main>

  <noscript><p class="container" data-i18n="noscript">Для работы Dalil QA включите JavaScript.</p></noscript>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <div id="busy" class="busy" hidden>
    <div class="busy-card" role="status" aria-live="polite">
      <div class="spinner"></div>
      <p id="busyText"></p>
    </div>
  </div>

  <!-- QR encoder: qrcode-generator 1.4.4 (c) Kazuhiko Arase, MIT licence — see header of qrcode.js -->
  <script src="qrcode.js"></script>
  <script src="qr.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
